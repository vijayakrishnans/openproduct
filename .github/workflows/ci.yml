# CI is orun: the plan job turns intent.yaml and the change into lanes, and
# each lane runs with remote state against the newopenproduct workspace, which
# brokers the Cloudflare deploy token per run. No credential is stored here.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: "Component names, comma-separated (component.yaml metadata.name); empty for every component"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, stage, prod]
      deploy_id:
        description: "Orunbase deploy record (dpl_…), set by Orunbase; appears in the run name"
        required: false
        type: string
        default: ""
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} → {1} · {2}', inputs.component || 'every component', inputs.environment, inputs.deploy_id || 'by hand') || '' }}
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: write
  id-token: write
  checks: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lane-matrix: ${{ steps.matrix.outputs.lane-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: linked
        run: |
          if grep -Eq '^[[:space:]]*workspace:[[:space:]]*ws_CHANGE_ME[[:space:]]*$' intent.yaml; then
            echo "::notice title=Orun CI::intent.yaml names no Orun workspace (ws_CHANGE_ME) — nothing to plan. Link this repository (orun cloud link) and set execution.state.workspace to turn the pipeline on."
            echo "linked=false" >> "$GITHUB_OUTPUT"
          else
            echo "linked=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.linked.outputs.linked == 'true'
        uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.78.4
      - if: steps.linked.outputs.linked == 'true'
        env:
          ORUN_VERBOSE: "1"
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Orun CI::A manual run deploys main only; this one was started on ${GITHUB_REF}."
              exit 1
            fi
            plan_args=(
              --trigger github-push-main
              --env "$DISPATCH_ENVIRONMENT"
              --intent intent.yaml
              --output plan.json
            )
            if [ -n "${DISPATCH_COMPONENT//[[:space:],]/}" ]; then
              orun plan --trigger github-push-main --env "$DISPATCH_ENVIRONMENT" \
                --intent intent.yaml --output env-plan.json --no-catalog-refresh >/dev/null
              kept=0
              IFS=',' read -ra picked <<< "$DISPATCH_COMPONENT"
              for c in "${picked[@]}"; do
                c="${c//[[:space:]]/}"
                [ -z "$c" ] && continue
                if ! [[ "$c" =~ ^[a-z0-9][a-z0-9._-]{0,99}$ ]]; then
                  echo "::error title=Orun CI::'$c' is not a component name (component.yaml metadata.name)."
                  exit 1
                fi
                if jq -e --arg c "$c" 'any(.jobs[]; .component == $c)' env-plan.json >/dev/null; then
                  plan_args+=(--component "$c")
                  kept=$((kept + 1))
                else
                  echo "::notice title=Orun CI::$c has nothing to run in ${DISPATCH_ENVIRONMENT} (or is not a component); left out."
                fi
              done
              if [ "$kept" = 0 ]; then
                jq '.jobs = [] | .lanes = []' env-plan.json > plan.json
                plan_args=()
              fi
            fi
          else
            plan_args=(
              --from-ci github
              --event-file "$GITHUB_EVENT_PATH"
              --intent intent.yaml
              --output plan.json
              --changed
            )
          fi
          if [ "${#plan_args[@]}" -gt 0 ]; then
            orun plan "${plan_args[@]}"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$(jq '.jobs | length' plan.json)" = 0 ]; then
            echo "::notice title=Orun CI::Nothing to run for ${DISPATCH_COMPONENT:-every component} in ${DISPATCH_ENVIRONMENT}."
          fi
      - id: matrix
        if: steps.linked.outputs.linked == 'true'
        run: |
         echo "lane-matrix=$(jq -c 'if ((.lanes // []) | length) > 0
           then [.lanes[] | {"lane": .id, "name": .name}]
           else [.jobs[] | {"lane": .id, "name": .checkName}] end' plan.json)" >> "$GITHUB_OUTPUT"
      - if: steps.linked.outputs.linked == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: orun-plan
          path: plan.json
  run:
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.lane-matrix != '[]' && needs.plan.outputs.lane-matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJson(needs.plan.outputs.lane-matrix) }}
    name: ${{ matrix.name }}
    env:
      npm_config_store_dir: /home/runner/.pnpm-store
      PNPM_STORE_DIR: /home/runner/.pnpm-store
    steps:
      - uses: actions/checkout@v6
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: orun-plan
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sourceplane/orun-action@v1.2.0
        with:
          version: v2.78.4
      - run: |
          retry_flag=""
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then retry_flag="--retry"; fi
          state_flag="--remote-state"
          orun run \
            --plan plan.json \
            --runner github-actions \
            $state_flag \
            --lane "${{ matrix.lane }}" \
            --exec-id "${{ github.run_id }}" \
            $retry_flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: /home/runner/.docker
