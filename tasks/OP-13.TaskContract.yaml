apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: OP-13
spec:
  goal: Rename People to Builders across the site, and add a section to every build page on reaching it from an AI assistant over openproduct's MCP server.
  affects:
    - default/openproduct/web
    - web/**
    - tasks/**
  doneWhen:
    - The menu, phone bar, page titles and search results say Builders, the pages live at /builders and /builders/<handle>, and the old /people links redirect there.
    - Every build page has an MCP section with the server address, setup for Claude Code, Cursor, VS Code and Claude.ai, a ready prompt for that build, and copy buttons.
    - Role badges and the header no longer stretch or wrap at mid widths.
  gates: []
