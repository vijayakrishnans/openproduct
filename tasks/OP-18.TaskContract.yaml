apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: OP-18
spec:
  goal: Sign in with Apple and a one-time email link (BP3), on the site's own domain.
  affects:
    - default/openproduct/web
    - web/**
    - tasks/**
    - specs/**
  doneWhen:
    - Sign in with Apple works on the custom domain.
    - An email link signs in once and expires after 15 minutes; tests cover reuse and expiry.
  gates: []
