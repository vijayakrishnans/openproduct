apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: OP-19
spec:
  goal: Support links (BP4) — builders and build maintainers add up to four allowlisted support links, shown on builder and build pages.
  affects:
    - default/openproduct/web
    - web/**
    - tasks/**
    - specs/**
  doneWhen:
    - A builder adds a Patreon link and it shows on their page; a maintainer adds one to their build and it shows there.
    - A link to a site off the allowlist is refused with the list of accepted sites; tests cover look-alike hosts, http and the limit.
  gates: []
